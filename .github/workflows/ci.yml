name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

# Cancel superseded runs on the same ref so rapid pushes don't pile up parallel
# Postgres/build jobs. Each job already caches npm via setup-node (cache: "npm").
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required gate: docs inventories must match the code (see docs/ARCHITECTURE.md).
  # Make this a required status check on `main` so PRs can't merge while docs drift.
  docs-drift:
    name: Docs drift guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: node scripts/check-docs-drift.mjs

  static-checks:
    name: Static checks (lint + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:errors

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Working-tree scan (no git history): a backstop against newly committed secrets.
      # Allowlist for example/fixture files lives in .gitleaks.toml. Pinned binary so we
      # don't depend on the licensed gitleaks-action.
      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: "8.18.4"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --no-git --source . --config .gitleaks.toml --redact --no-banner --exit-code 1

  brain-tests:
    name: Brain unit tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      # python3 is a HARD dependency of the unit tier, not an incidental one:
      # test/guards/graphiti-patch-same-item.test.ts runs the committed patch script and EXECUTES the
      # Python it inserts, rather than paraphrasing it in TS. That guard fails loudly without python3
      # (a self-skipping guard disarms silently), so declare the interpreter here instead of
      # inheriting whatever the runner image happens to ship.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run test:gateway-approval-contracts
      - run: npm test
      # Coverage gate: thresholds in vitest.config.ts (lib/** scope). Fails the job
      # if coverage drops below the floor. Ratchet thresholds up as tests improve.
      - run: npm run coverage

  datamechanics-tests:
    name: Data-mechanics tests (real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # Matches vitest.datamechanics.config.ts (no-prod-fallback guard reads this).
      DATABASE_TEST_URL: postgres://app:app@localhost:5434/app_test
    steps:
      - uses: actions/checkout@v7
        with:
          # The migrate-from-existing lane reads prior schema states straight out of git
          # (`git show v0.7.0:postgres/schema.sql`) instead of maintaining fixture files, so it
          # needs the full history and the TAGS. The default shallow, tagless checkout would make
          # it fail with "unknown git tag" rather than silently pass.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      # migrate-from-zero into the service DB (also the replay guard)
      - run: DATABASE_URL="$DATABASE_TEST_URL" npm run pg:schema
      - run: npm run test:gateway-approval
      - run: npm run test:datamechanics
      # migrate-from-EXISTING: the from-zero load above cannot observe an additive migration at all
      # (schema.sql already builds every object in its final shape, so every migration after it is a
      # no-op). This step loads each released tag's schema state into its own scratch database, rolls
      # the current deploy forward over it, and asserts the catalog fingerprint matches a from-zero
      # build — which is what fails when someone edits schema.sql and forgets the migration.
      # LAST on purpose: it takes ~10s, and running it first would let a red fingerprint abort the
      # job and suppress the data-mechanics output for that run. Both signals on every run.
      - run: npm run test:migrate-from-existing

  http-tests:
    name: Integration tests (HTTP)
    runs-on: ubuntu-latest
    # Now a blocking gate: the job was green on >5 consecutive `main` runs (the documented
    # promotion bar — see docs/CI-ARCHITECTURE.md). To finish the promotion, add the
    # "Integration tests (HTTP)" check to branch protection on `main` (repo Settings → Branches).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # Both the test process (seeding via lib/ingest) and the spawned next server read this.
      DATABASE_TEST_URL: postgres://app:app@localhost:5434/app_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: DATABASE_URL="$DATABASE_TEST_URL" npm run pg:schema
      # Production build first; global-setup spawns `next start` against .next.
      - run: npm run build
      - run: npm run test:http
      - run: npm run test:http:gateway-approval

  # The real-Neo4j tier — the ONLY behavioural proof that graph tier isolation holds (group_id is
  # the sole enforcement, no RLS backstop) and, since GRAPHSAT-1, of the per-item episode lookup
  # that drives ledger mutations. NEO4JCI-1: this tier was in no CI job and rotted unseen for ~4
  # weeks (a green `npm test` reported it skipped). The service's image/auth/bolt port/health contract
  # = compose.test.neo4j.yml (the validator pins exactly those); NEO4J_TIER_REQUIRED makes an unset NEO4J_TEST a collection error instead of a silent
  # skip. The wiring is pinned by test/guards/neo4j-tier-wiring.test.ts.
  neo4j-tier-tests:
    name: Graph Neo4j tier (real Neo4j)
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26.2
        env:
          NEO4J_AUTH: neo4j/testtest1
        ports: ["7688:7687"]
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testtest1 'RETURN 1' || exit 1"
          --health-interval 3s --health-timeout 5s --health-retries 40
    env:
      NEO4J_TIER_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run test:neo4j

  ingestion-tests:
    name: Ingestion tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestion
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      # The reader extras are opt-in for operators but REQUIRED here: tests/test_reader_api_conformance.py
      # checks the kwargs our Notion/Drive/Confluence adapters pass against the real installed classes,
      # which is the only tier that catches a reader renaming a kwarg (we have no accounts to test against).
      # Without them those checks turn into silent skips — which `test_conformance_is_not_silently_skipped_in_ci`
      # fails the build for, via CI=true.
      #
      # DELIBERATELY UNPINNED (pyproject says `>=0.1`), which means a new reader release can turn this
      # job red on an UNRELATED PR. That is the intended trade: an operator installing today gets the
      # latest reader, so testing anything else would prove nothing about what they run. Such a red is
      # real information — the connector is broken against the current library. Fix the adapter (or pin
      # the reader in pyproject and say why); do not just re-run.
      - run: uv pip install --system -e '.[dev,radar,notion,gdrive,confluence]'
      - run: pytest -q
