name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

# Cancel superseded runs on the same ref so rapid pushes don't pile up parallel
# Postgres/build jobs. Each job already caches npm via setup-node (cache: "npm").
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required gate: docs inventories must match the code (see docs/ARCHITECTURE.md).
  # Make this a required status check on `main` so PRs can't merge while docs drift.
  docs-drift:
    name: Docs drift guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: node scripts/check-docs-drift.mjs

  static-checks:
    name: Static checks (lint + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:errors

  # Required gate: no confidential identifier reaches this PUBLIC repo.
  #
  # This exists because one did. A client's name landed on `main` in #586 and was only noticed days
  # later, by an unrelated push from a different machine. The pre-existing gate is a PER-MACHINE hook
  # reading a private term list, and `.githooks/pre-push` skips it silently when absent (deliberately
  # — contributors do not have the list). So whether a client name reached a public repo depended on
  # whose laptop ran `git push`, and nothing here checked at all.
  #
  # The term list stays OUT of the repo (it names the clients it protects) and arrives as the
  # `NDA_TERMS` secret. The output is REDACTED to file:line — these logs are world-readable, so a
  # gate that printed what it matched would publish the thing it defends (same reason the gitleaks
  # job below runs with `--redact`).
  nda-gate:
    name: NDA confidentiality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Scan tracked tree for confidential identifiers
        env:
          NDA_TERMS: ${{ secrets.NDA_TERMS }}
          # GitHub withholds secrets from fork PRs by design, so this gate CANNOT run there. That is
          # reported, never silently passed — an unrunnable gate is not a passing grade.
          IS_FORK: ${{ github.event.pull_request.head.repo.fork || 'false' }}
        run: |
          if [ -z "${NDA_TERMS:-}" ]; then
            if [ "$IS_FORK" = "true" ]; then
              echo "::warning title=NDA gate could not run::Fork PR — GitHub withholds secrets from forks, so the confidentiality gate did NOT run. A maintainer must run it before merge: NDA_TERMS=\"\$(cat ~/.config/aios-nda/terms.txt)\" node scripts/nda-scan.mjs"
              exit 0
            fi
            echo "::error title=NDA gate misconfigured::NDA_TERMS secret is not set on this repository. The gate fails closed rather than reporting a pass."
            exit 1
          fi
          node scripts/nda-scan.mjs

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Working-tree scan (no git history): a backstop against newly committed secrets.
      # Allowlist for example/fixture files lives in .gitleaks.toml. Pinned binary so we
      # don't depend on the licensed gitleaks-action.
      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: "8.18.4"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --no-git --source . --config .gitleaks.toml --redact --no-banner --exit-code 1

  brain-tests:
    name: Brain unit tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      # python3 is a HARD dependency of the unit tier, not an incidental one:
      # test/guards/graphiti-patch-same-item.test.ts runs the committed patch script and EXECUTES the
      # Python it inserts, rather than paraphrasing it in TS. That guard fails loudly without python3
      # (a self-skipping guard disarms silently), so declare the interpreter here instead of
      # inheriting whatever the runner image happens to ship.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run test:gateway-approval-contracts
      - run: npm test
      # Coverage gate: thresholds in vitest.config.ts (lib/** scope). Fails the job
      # if coverage drops below the floor. Ratchet thresholds up as tests improve.
      - run: npm run coverage

  datamechanics-tests:
    name: Data-mechanics tests (real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # Matches vitest.datamechanics.config.ts (no-prod-fallback guard reads this).
      DATABASE_TEST_URL: postgres://app:app@localhost:5434/app_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      # migrate-from-zero into the service DB (also the replay guard)
      - run: DATABASE_URL="$DATABASE_TEST_URL" npm run pg:schema
      - run: npm run test:gateway-approval
      - run: npm run test:datamechanics

  http-tests:
    name: Integration tests (HTTP)
    runs-on: ubuntu-latest
    # Now a blocking gate: the job was green on >5 consecutive `main` runs (the documented
    # promotion bar — see docs/CI-ARCHITECTURE.md). To finish the promotion, add the
    # "Integration tests (HTTP)" check to branch protection on `main` (repo Settings → Branches).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # Both the test process (seeding via lib/ingest) and the spawned next server read this.
      DATABASE_TEST_URL: postgres://app:app@localhost:5434/app_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: DATABASE_URL="$DATABASE_TEST_URL" npm run pg:schema
      # Production build first; global-setup spawns `next start` against .next.
      - run: npm run build
      - run: npm run test:http
      - run: npm run test:http:gateway-approval

  ingestion-tests:
    name: Ingestion tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestion
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      # The reader extras are opt-in for operators but REQUIRED here: tests/test_reader_api_conformance.py
      # checks the kwargs our Notion/Drive/Confluence adapters pass against the real installed classes,
      # which is the only tier that catches a reader renaming a kwarg (we have no accounts to test against).
      # Without them those checks turn into silent skips — which `test_conformance_is_not_silently_skipped_in_ci`
      # fails the build for, via CI=true.
      #
      # DELIBERATELY UNPINNED (pyproject says `>=0.1`), which means a new reader release can turn this
      # job red on an UNRELATED PR. That is the intended trade: an operator installing today gets the
      # latest reader, so testing anything else would prove nothing about what they run. Such a red is
      # real information — the connector is broken against the current library. Fix the adapter (or pin
      # the reader in pyproject and say why); do not just re-run.
      - run: uv pip install --system -e '.[dev,radar,notion,gdrive,confluence]'
      - run: pytest -q
