  policy-witness:
    name: Local policy witness publisher (no secrets)
    # `policy-witness` mode ONLY, and every other job is skipped in it. This job is the F1 transport's
    # single hop: it republishes a bounded witness envelope the authenticated local operator dispatched.
    #
    # It holds NO App secret, NO protected environment and NO write scope. GitHub authenticates its
    # ACTOR, the immutable source it ran and the artifact bytes — it does NOT attest that the
    # measurement inside is true, and the runner's own comment header says so where it matters.
    if: github.event_name == 'workflow_dispatch' && github.repository == 'aiosbrain/aios-team-brain' && github.ref == 'refs/heads/staging' && inputs.mode == 'policy-witness'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      # No `npm ci`: the publisher uses node built-ins and the repository-approved pinned upload
      # action only. An install step here would be an unnecessary supply-chain surface in the one job
      # whose whole purpose is to move bytes it did not compute.
      - name: Republish the witness envelope as a single-entry artifact
        id: publish
        env:
          COMMISSIONING_MODE: ${{ inputs.mode }}
          COMMISSIONING_EVIDENCE_DIR: ${{ runner.temp }}/policy-commissioning
          GITHUB_TOKEN: ${{ github.token }}
          COMMISSIONING_REPOSITORY_ID: ${{ vars.COMMISSIONING_REPOSITORY_ID }}
        run: >-
          node --input-type=module -e 'import { runWitnessPublisherJob } from "./scripts/staging-ops/policy-commissioning.mjs";
          await runWitnessPublisherJob(process.env);'
      # The artifact NAME is derived by reviewed code from validated envelope fields and handed to
      # this fixed step as a step output. There is nothing here for a caller to choose, and a name is
      # never taken from the dispatch input.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.publish.outputs.artifact_name }}
          path: ${{ runner.temp }}/policy-commissioning/witness/witness.json
          if-no-files-found: error
          retention-days: 30

  transport-rehearsal:
    name: Transport rehearsal (inert, no secrets)
    # `transport-rehearsal` mode ONLY. This measures the queue, clock and serialization viability of
    # the witness transport BEFORE any protected approval exists — which is the circularity the
    # canonical revision resolves by giving the rehearsal its own source mode, its own closed case and
    # an inert target. Its target is the literal `rehearsal`, never a Git ref; it touches no synthetic
    # graph, no resource journal and no policy; and every actor consumer rejects its source mode,
    # domain, case and target before credentials.
    #
    # A failed rehearsal does not authorize broader infrastructure or relaxed bounds, and its response
    # can never satisfy an actor case or contribute to the commissioning publication count.
    if: github.event_name == 'workflow_dispatch' && github.repository == 'aiosbrain/aios-team-brain' && github.ref == 'refs/heads/staging' && inputs.mode == 'transport-rehearsal'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Rehearsal 1/3 create the inert challenge
        env:
          COMMISSIONING_MODE: ${{ inputs.mode }}
          COMMISSIONING_EVIDENCE_DIR: ${{ runner.temp }}/policy-commissioning
          GITHUB_TOKEN: ${{ github.token }}
          COMMISSIONING_REPOSITORY_ID: ${{ vars.COMMISSIONING_REPOSITORY_ID }}
        run: >-
          node --input-type=module -e 'import { runRehearsalStage } from "./scripts/staging-ops/policy-commissioning.mjs";
          await runRehearsalStage({ stage: "challenge" });'
      - name: Rehearsal 2/3 publish the inert challenge
        uses: actions/upload-artifact@v4
        with:
          name: commissioning-challenge-${{ github.run_id }}-${{ github.run_attempt }}-rehearsal-00-pre
          path: ${{ runner.temp }}/policy-commissioning/challenges/commissioning-challenge-${{ github.run_id }}-${{ github.run_attempt }}-rehearsal-00-pre.json
          if-no-files-found: error
          retention-days: 30
      - name: Rehearsal 3/3 consume the inert response
        env:
          COMMISSIONING_MODE: ${{ inputs.mode }}
          COMMISSIONING_EVIDENCE_DIR: ${{ runner.temp }}/policy-commissioning
          GITHUB_TOKEN: ${{ github.token }}
          COMMISSIONING_REPOSITORY_ID: ${{ vars.COMMISSIONING_REPOSITORY_ID }}
        run: >-
          node --input-type=module -e 'import { runRehearsalStage } from "./scripts/staging-ops/policy-commissioning.mjs";
          await runRehearsalStage({ stage: "consume" });'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: policy-commissioning-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/policy-commissioning/commissioning-${{ github.run_id }}-${{ github.run_attempt }}-transport-rehearsal.json
          if-no-files-found: error
          retention-days: 30
