name: scan-on-merge

# Keep the codebase's agent-readiness fresh: on every merge to the contribution base OR the
# integration branch (RELPTR-4 — it was `main` only), scan this repo with the
# ingestion scanner and push the result (full raw metrics + readiness) to the Team Brain.
# The scan is read-only against the repo and idempotent on the brain (keyed by head_sha).
#
# We run `npm run coverage` first so a fresh coverage/coverage-summary.json exists for the
# scanner's _read_coverage() to pick up — otherwise test_coverage_pct lands null and the
# Codebases dashboard shows "no reports". The coverage GATE still lives in ci.yml; here it is
# purely a metrics source, so a threshold miss must not block the scan (|| true).
#
# Required repo secrets (until set, the job logs "skipping" and exits 0 — never red):
#   AIOS_BRAIN_URL — e.g. https://aios-team-brain-production.up.railway.app
#   AIOS_TEAM      — team slug (e.g. aios)
#   AIOS_API_KEY   — a TEAM-TIER api key (codebase scans are team-tier; keep it least-privilege)
# (These already exist for the aios-work-sync workflow; the scanner reads BRAIN_URL, mapped below.)
# GITHUB_TOKEN is the built-in token (read access to this repo for stars/issues metadata).

# RELPTR-4 — both branches. After the cutover `main` advances only by release fast-forward, so a
# `[main]`-only trigger would silently drop codebase-readiness from per-merge to per-release freshness.
# THE COST, stated rather than claimed away — an earlier version of this comment said "carries no
# risk", and both reviewers showed that is false. `head_sha` idempotency only deduplicates the SAME
# commit. A mistaken push to the 259-behind `staging` scans that stale tree and it becomes the
# dashboard's CURRENT readiness, because `lib/metrics/codebases.ts` picks the newest point by
# `scanned_at` (wall clock), not by ancestry — and `reconcile_codebase_findings` computes staleness the
# same way, so findings fixed since staging's tip get reopened and findings introduced since get
# resolved. It heals at the next merge to the contribution base. Accepted for the same reason as
# `aios-work-sync`'s: cheaper than doing this on cutover day.
on:
  push:
    branches: [main, staging]

permissions:
  contents: read
  issues: read
  pull-requests: read

# One scan at a time; newer pushes supersede in-flight ones.
# PER-REF, not one global group. With a single group a push to one branch CANCELS an in-flight scan
# of the other (`cancel-in-progress: true`), so widening the trigger would have let a staging push kill
# a main scan and leave the older snapshot as the latest. Codex found that.
concurrency:
  group: scan-on-merge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: codebase readiness scan → brain
    runs-on: ubuntu-latest
    if: github.repository == 'aiosbrain/aios-team-brain'
    # ENROLMENT, NOT ISOLATION. `trusted-automation` is a repository Environment whose deployment
    # branch policy allows `main` only. Naming it here is a BLAST-RADIUS control: it declares which
    # workflows in this repository may reach AIOS_BRAIN_URL / AIOS_TEAM / AIOS_API_KEY. It is not a
    # trust boundary of any kind, and it does not make the credentials environment-scoped on its own —
    # an environment secret only SHADOWS a same-named repository secret. This job is the third and
    # last of the three `AIOS_*` consumers to enrol (`pr-task-link.yml` and `aios-work-sync.yml` are
    # the others), which is what makes deleting the repository-level copies possible; that deletion is
    # a manual admin step, deliberately not part of the change that added this line.
    #
    # WHY THE POLICY ACCEPTS THIS JOB, and why this one is DIFFERENT from its two siblings: the
    # trigger is `push`, so the run's ref is the PUSHED BRANCH — not the default branch. The
    # 2025-12-08 GitHub change that made `pull_request_target` evaluate environments against the
    # default branch does NOT apply here, because this is not that event.
    #
    # MEASURED, not predicted: on 2026-09-05, while `trusted-automation` still permitted `main`
    # only, two pushes to `staging` were refused the environment and the job went red in 3 seconds
    # having run ZERO steps — loud rather than silent, with no scan posted. The policy was widened to
    # `[main, staging]` before the cutover, which is what makes both entries in the trigger usable.
    # If a future branch joins this trigger, the policy must gain it too or this job dies the same way.
    environment: trusted-automation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history — the scanner reads the commit window
          persist-credentials: false

      # Produce coverage/coverage-summary.json (lib/** lines pct) for the scanner to read.
      # `|| true`: this is a metrics source, not a gate — never block the scan on coverage.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
      - name: Generate coverage report (metrics source for the scanner)
        run: |
          if npm ci --ignore-scripts; then
            npm run coverage || true
          else
            echo "dependency install failed — continuing without a coverage report."
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the ingestion scanner
        run: >-
          python -m pip install --only-binary=:all: --require-hashes
          -r .github/scripts/brain-scanner-requirements.txt

      - name: Scan this repo into the brain
        env:
          BRAIN_URL: ${{ secrets.AIOS_BRAIN_URL }}
          AIOS_TEAM: ${{ secrets.AIOS_TEAM }}
          AIOS_API_KEY: ${{ secrets.AIOS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: ingestion
        run: |
          if [ -z "$AIOS_API_KEY" ] || [ -z "$BRAIN_URL" ] || [ -z "$AIOS_TEAM" ]; then
            echo "scan secrets not configured (BRAIN_URL/AIOS_TEAM/AIOS_API_KEY) — skipping."
            exit 0
          fi
          python -m aios_ingest.cli scan \
            --path . --slug aios-team-brain --full-name "$GITHUB_REPOSITORY"
