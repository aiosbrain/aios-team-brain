version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    # RELPTR-7: Dependabot follows the DEFAULT branch absent an override, and the default moved
    # to `staging` at the cutover. Pinned explicitly so the target is a declared fact rather
    # than a consequence of a setting in another system.
    target-branch: "staging"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev-dependencies:
        dependency-type: "development"
      prod-dependencies:
        dependency-type: "production"

  - package-ecosystem: "pip"
    directory: "/ingestion"
    # RELPTR-7: Dependabot follows the DEFAULT branch absent an override, and the default moved
    # to `staging` at the cutover. Pinned explicitly so the target is a declared fact rather
    # than a consequence of a setting in another system.
    target-branch: "staging"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    # RELPTR-7: Dependabot follows the DEFAULT branch absent an override, and the default moved
    # to `staging` at the cutover. Pinned explicitly so the target is a declared fact rather
    # than a consequence of a setting in another system.
    target-branch: "staging"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns:
          - "*"
