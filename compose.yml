# AIOS Team Brain — one-command local stack.
#
#   docker compose up          → http://localhost:3000, schema loaded, demo team seeded,
#                                and a printed login. No host Node, no Postgres, no keys.
#
# This is for EVALUATING the brain and for contributors who want a disposable database.
# It is not how a team runs one: the brain is a shared service with background pollers
# that only tick while the process is up (README §2). For that, deploy it.
#
# No secrets are committed here. AUTH_SECRET and SECRETS_KEY are generated on first boot
# and persisted in the `appdata` volume, so every install gets its own and they stay stable
# across restarts (a rotating SECRETS_KEY would orphan encrypted connector tokens; a rotating
# AUTH_SECRET would log everyone out). Export either one to override.
name: aios-brain

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    # 5435, not 5432/5433/5434: leaves a host Postgres, another project's dev DB, and the
    # data-mechanics tier in compose.test.yml all free to run at the same time.
    # Override to run several workspaces at once — the app reaches Postgres over the compose
    # network at postgres:5432 regardless, so this port is only for reaching it from the host
    # (`psql`). Pair it with COMPOSE_PROJECT_NAME so each stack gets its own containers/volumes:
    #   COMPOSE_PROJECT_NAME=aios-mine APP_PORT=3100 PG_PORT=5436 docker compose up
    ports: ["${PG_PORT:-5435}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    # Host port is overridable because 3000 is the most contended port on a dev machine
    # (any other Next/Vite app already running will take it): APP_PORT=3100 docker compose up
    ports: ["${APP_PORT:-3000}:3000"]
    volumes: ["appdata:/var/lib/aios"]
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/app
      # Must match the published port — it's what invite/magic links are built from.
      APP_URL: http://localhost:${APP_PORT:-3000}
      # Left empty on purpose: generated on first boot and persisted to DEV_SECRETS_FILE.
      # Set them in your shell to bring your own.
      AUTH_SECRET: ${AUTH_SECRET:-}
      SECRETS_KEY: ${SECRETS_KEY:-}
      DEV_SECRETS_FILE: /var/lib/aios/dev-secrets.env
      # Optional: answer queries. Everything else works without them.
      # Exported on the host → picked up here; unset → left empty.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # The other providers the setup wizard can configure. Absent from this list, a key the user
      # pasted would be validated and then silently dropped on the floor.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      # A REAL local install: bootstrap provisions this team + admin instead of the demo. These must
      # be forwarded explicitly — compose does not inherit the parent process's environment, so
      # without these four lines `npm run setup`'s local target boots a brain with no way to log in.
      TEAM_SLUG: ${TEAM_SLUG:-}
      TEAM_NAME: ${TEAM_NAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      # SEED_DEMO=false for an empty brain. Forwarded EMPTY rather than defaulted, and that is
      # deliberate: bootstrap seeds the demo by default on a local URL anyway, but it also refuses
      # to seed a production build served at a PUBLIC address unless SEED_DEMO is explicitly true
      # (scripts/setup/deploy-policy.mjs). Baking `:-true` in here would answer that question on
      # the operator's behalf — so running this stack behind a real domain would publish the
      # documented demo login, which is the thing the policy exists to stop.
      SEED_DEMO: ${SEED_DEMO:-}
      DEMO_EMAIL: ${DEMO_EMAIL:-admin@demo.local}
      # Same reasoning: empty means "bootstrap decides" — the documented password locally, a
      # generated one if the demo is ever opted into a public deploy.
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}

volumes:
  pgdata:
  appdata:
